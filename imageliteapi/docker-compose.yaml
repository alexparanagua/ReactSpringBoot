services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: imagelite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres -d imagelite" ]
        interval: 5s
        timeout: 5s
        retries: 5
  pgadmin:
    image: dpage/pgadmin4:9.19
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15432:80"
    depends_on:
        db:
            condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge